name: pages

# Publishes the project site, https://rxflex.github.io/TSMP/, from site/.
# The pictures are not copied into site/: they are taken from docs/assets/,
# the same files the READMEs use, and served under assets/.
on:
  push:
    # The default branch. Update this when a new default branch is started
    # for a new game version, or edits there will not redeploy the site.
    branches: ["1.129.39.1030"]
    paths:
      - "site/**"
      - "docs/assets/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r site/. _site
          mkdir -p _site/assets
          cp -r docs/assets/. _site/assets/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
