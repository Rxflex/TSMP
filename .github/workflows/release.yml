name: release

# Pushing a tag v<version> builds the launcher, with the mod inside it, and
# the session server, and publishes them as a release. Running launchers find
# it and update.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Session servers usually run on Linux.
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test and build the session server
        run: |
          cargo test -p tsmp-net -p tsmp-server
          cargo build --release -p tsmp-server
          cp target/release/tsmp-server tsmp-server-linux-x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: server
          path: tsmp-server-linux-x86_64

  release:
    needs: server
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: The tag is the launcher's version
        shell: bash
        run: |
          version=$(grep -m1 '^version' crates/tsmp-launcher/Cargo.toml | cut -d'"' -f2)
          test "v$version" = "$GITHUB_REF_NAME"

      # The game loads Python 3.7 bytecode only.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.7"

      - name: Test and build the mod
        run: |
          python -m unittest discover -s mod/tests
          python mod/build.py

      - name: Test and build the launcher
        run: |
          cargo test -p tsmp-core -p tsmp-net -p tsmp-server -p tsmp-launcher
          cargo build --release -p tsmp-launcher

      - uses: actions/download-artifact@v4
        with:
          name: server

      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" target/release/tsmp.exe dist/tsmp.ts4script tsmp-server-linux-x86_64 --generate-notes
