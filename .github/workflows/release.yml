name: release

# Pushing a tag v<version> builds the launcher, with the mod inside it, and
# the session server, and publishes them as a release. Running launchers find
# it and update. The release page is written from CHANGELOG.md and
# CHANGELOG.ru.md by .github/release/notes.py: a version with no section
# there is not released.
#
# Started by hand (Actions, release, Run workflow), it does everything but
# publish, whichever branch or tag it is started on: the files and the page it
# would publish are kept with the run. Started by hand on a branch with
# "publish" ticked, it publishes too, tagging the commit it built; that is for
# releasing without pushing a tag. A failed release is run again with
# "Re-run jobs" on its own run.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the release, tagging this commit v<version>"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # Session servers usually run on Linux. The server is linked statically
  # (musl), so it runs on any x86_64 Linux, old or new.
  server:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      # The version is the launcher's; a tag must name it.
      - name: Version
        id: version
        run: |
          version="v$(grep -m1 '^version' crates/tsmp-launcher/Cargo.toml | cut -d'"' -f2)"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "::error::The tag $GITHUB_REF_NAME is not the launcher's version $version"
            exit 1
          fi
          if [ "${{ inputs.publish }}" = true ] && [ "$GITHUB_REF_TYPE" != branch ]; then
            echo "::error::Publishing by hand starts on a branch; a tag is published by pushing it"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: The release is described in the changelogs
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for changelog in CHANGELOG.md CHANGELOG.ru.md; do
            if ! grep -qF "## $VERSION " "$changelog" && ! grep -qxF "## $VERSION" "$changelog"; then
              echo "::error file=$changelog::$changelog has no section for $VERSION"
              exit 1
            fi
          done

      - name: Test and build the session server
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup target add x86_64-unknown-linux-musl
          cargo test -p tsmp-net -p tsmp-server
          cargo build --release --target x86_64-unknown-linux-musl -p tsmp-server
          cp target/x86_64-unknown-linux-musl/release/tsmp-server tsmp-server-linux-x86_64
          file tsmp-server-linux-x86_64 | grep -q 'static'
          ./tsmp-server-linux-x86_64 --version

      - uses: actions/upload-artifact@v4
        with:
          name: server
          path: tsmp-server-linux-x86_64

  release:
    needs: server
    runs-on: windows-latest
    # Bash stops at the first command that fails; PowerShell would only look
    # at the last one of each step.
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.server.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The release page lists every change since the previous tag.
          fetch-depth: 0

      # The game loads Python 3.7 bytecode only.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.7"

      - name: Test and build the mod
        run: |
          python -m unittest discover -s mod/tests
          python mod/build.py

      - name: Test and build the launcher
        run: |
          cargo test -p tsmp-core -p tsmp-net -p tsmp-server -p tsmp-launcher
          cargo build --release -p tsmp-launcher

      - uses: actions/download-artifact@v4
        with:
          name: server
          path: dist

      - name: Write the release page
        run: |
          cp target/release/tsmp.exe dist/
          python .github/release/notes.py "$VERSION" dist notes.md title.txt
          cat notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Keep what a run by hand would publish
        if: github.event_name != 'push' && !inputs.publish
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ env.VERSION }}
          path: |
            dist/tsmp.exe
            dist/tsmp.ts4script
            dist/tsmp-server-linux-x86_64
            dist/SHA256SUMS.txt
            notes.md
            title.txt

      - name: Publish
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        # Run by hand, the tag does not exist yet: the release makes it, on
        # the commit that was built.
        run: |
          gh release create "$VERSION" \
            dist/tsmp.exe dist/tsmp.ts4script dist/tsmp-server-linux-x86_64 dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "$(cat title.txt)" --notes-file notes.md
