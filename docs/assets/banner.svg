<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="TSMP: two houses at night, joined by one line">
<defs>
<pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#1b2946" stroke-width="1"/></pattern>
<radialGradient id="glow"><stop offset="0" stop-color="#ffc857" stop-opacity=".34"/><stop offset="1" stop-color="#ffc857" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1280" height="400" rx="18" fill="#111b30"/>
<rect width="1280" height="400" rx="18" fill="url(#grid)"/>
<g fill="#93a4c4">
<circle cx="96" cy="58" r="1.6"/><circle cx="212" cy="112" r="1.2"/><circle cx="338" cy="44" r="1.7"/><circle cx="470" cy="92" r="1.2"/>
<circle cx="590" cy="38" r="1.5"/><circle cx="716" cy="74" r="1.2"/><circle cx="842" cy="40" r="1.6"/><circle cx="968" cy="104" r="1.2"/>
<circle cx="1184" cy="132" r="1.3"/><circle cx="60" cy="150" r="1.2"/><circle cx="1230" cy="52" r="1.5"/>
</g>
<circle cx="1106" cy="78" r="26" fill="#ffe7ad"/><circle cx="1094" cy="70" r="24" fill="#111b30"/>

<ellipse cx="250" cy="276" rx="190" ry="96" fill="url(#glow)"/>
<ellipse cx="1030" cy="276" rx="190" ry="96" fill="url(#glow)"/>
<path d="M40 322H1240" stroke="#34486e" stroke-width="2"/>

<!-- the line between the two houses -->
<path d="M250 322v26h780v-26" fill="none" stroke="#ffc857" stroke-width="2.5" stroke-dasharray="2 10" stroke-linecap="round"/>
<circle cx="250" cy="348" r="5" fill="#ffc857"/><circle cx="1030" cy="348" r="5" fill="#ffc857"/>

<g stroke="#7f97c4" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
<!-- host -->
<path d="M300 186v-30h22v48" fill="#1d2c49"/>
<path d="M150 232h200v90H150z" fill="#25375a"/>
<path d="M132 232l118-76 118 76z" fill="#1d2c49"/>
<path d="M234 322v-52h32v52" fill="#16223a"/>
<path d="M172 254h40v32h-40zM288 254h40v32h-40z" fill="#ffc857" stroke="#ffc857"/>
<!-- guest -->
<path d="M930 232h200v90H930z" fill="#25375a"/>
<path d="M912 232l118-76 118 76z" fill="#1d2c49"/>
<path d="M1014 322v-52h32v52" fill="#16223a"/>
<path d="M952 254h40v32h-40zM1068 254h40v32h-40z" fill="#ffc857" stroke="#ffc857"/>
</g>
<path d="M192 254v32M172 270h40M308 254v32M288 270h40M972 254v32M952 270h40M1088 254v32M1068 270h40" stroke="#1a1503" stroke-width="1.8"/>
<g stroke="#63d9b0" stroke-width="2.5" stroke-linecap="round">
<path d="M84 322v-34"/><circle cx="84" cy="268" r="24" fill="#173a40"/>
<path d="M1196 322v-26"/><circle cx="1196" cy="282" r="18" fill="#173a40"/>
</g>

<g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">
<text x="640" y="196" font-size="112" font-weight="800" letter-spacing="10" fill="#eaf0fa">TSMP</text>
<text x="640" y="244" font-size="25" fill="#93a4c4">one household, two computers, one local network</text>
<text x="640" y="382" font-size="17" fill="#ffc857">same lot · same clock · both building at once</text>
</g>
</svg>
